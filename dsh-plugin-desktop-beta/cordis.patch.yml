# Travel Buddy (T21): the client is end-user only. The stock DSH admin surfaces are
# switched off in the shell layer so that a brand-new profile (no user patch yet) is
# already clean: plugin manager, scheduler, entry customization, the plugin market
# launcher page, and the super-admin settings pages. Administration lives in a separate
# web console, so these rows are constants instead of per-user entitlements.
- id: ui-schedule
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name; the user patch layer
  # can still override this row, but the shipped default hides the market browser.
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  config:
    enabled: false
- insert:
    - id: desktop-next-capabilities
      name: dsh-plugin-desktop-beta
    # Computer Use (Next) keeps its registry in a realm of its own, so the
    # official Computer Use bundle can mount its registry beside it.
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
      isolate:
        computerUse: computer-use-next
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
      disabled: true
      isolate:
        computerUse: computer-use-next
# Upstream mounts its Desktop product analytics for every Profile named
# `desktop` and reports to DeepSeek's collector by default. DSH Desktop does
# not take part in that collection. Its exporter also requires the upstream
# Electron shell's DSH_CLIENT_VERSION, which Next never provides.
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true